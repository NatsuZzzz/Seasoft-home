# Bat khi deploy: SPRING_PROFILES_ACTIVE=prod
# Prod bat buoc khai bao CORS_ORIGINS (vd: https://seasoft.vn) va FRONTEND_URL
app.cors.allowed-origins=${CORS_ORIGINS}
app.frontend-url=${FRONTEND_URL}

# Khong lo stacktrace / message loi noi bo ra ngoai
server.error.include-stacktrace=never
server.error.include-message=never

# Chay sau reverse proxy (Nginx/Render...): lay IP that + https tu X-Forwarded-*
# -> rate limit tinh dung theo IP nguoi dung thay vi IP cua proxy
server.forward-headers-strategy=native

# Nen response
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/xml,text/plain

# Frontend nam trong jar (Docker copy Html/ vao classpath:/static/)
spring.web.resources.static-locations=classpath:/static/
# Khong dat max-age chung: HTML/JS/CSS khong co hash trong ten file -> deploy moi phai thay ngay.
# Trinh duyet van dung Last-Modified (304) nen khong tai lai file khong doi.

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
