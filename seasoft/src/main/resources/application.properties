spring.application.name=seasoft
# ---------------------------------------------------------
# Secret doc tu bien moi truong. Khi dev local, tao file seasoft/.env
# (copy tu .env.example) - file nay da duoc gitignore.
# ---------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------
# Ket noi PostgreSQL
# ---------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SeaSoft}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------
# Flyway quan ly schema (src/main/resources/db/migration)
# baseline-on-migrate: DB cu da co bang -> danh dau la V1, khong chay lai V1
# ---------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------------------------------------------------------
# JPA / Hibernate - chi kiem tra entity khop schema, khong tu sua bang
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
# Access token 15 phut, refresh token 7 ngay (ms)
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Frontend: Spring serve luon thu muc Html/ (chay tu thu muc seasoft/)
spring.web.resources.static-locations=classpath:/static/,file:../Html/
# Link trong email (quen mat khau) tro ve day
app.frontend-url=${FRONTEND_URL:http://localhost:8080}

# ---------------------------------------------------------
# Mail: chua set env SPRING_MAIL_HOST -> khong gui that, chi log ra console
# ---------------------------------------------------------
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@seasoft.vn}
# Email nhan thong bao khi co lead moi (bo trong = khong gui)
app.lead-notify-email=${LEAD_NOTIFY_EMAIL:}

# Tai khoan ADMIN dau tien (chi tao khi DB chua co admin nao)
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.name=${ADMIN_NAME:}

# Health check cho hosting / Docker: chi mo /actuator/health, khong lo chi tiet
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Chong do mat khau / spam (gia tri mac dinh, co the ghi de bang env)
app.rate-limit.login.ip-max=${LOGIN_RATE_IP_MAX:30}
app.rate-limit.login.email-max=${LOGIN_RATE_EMAIL_MAX:10}
app.rate-limit.forgot.ip-max=${FORGOT_RATE_IP_MAX:10}
app.rate-limit.forgot.email-max=${FORGOT_RATE_EMAIL_MAX:3}
app.rate-limit.register.ip-max=${REGISTER_RATE_IP_MAX:10}

# Chong spam form tu van: toi da N lan / cua so (phut) / IP
app.rate-limit.consultation.max=${CONSULTATION_RATE_MAX:5}
app.rate-limit.consultation.window-minutes=${CONSULTATION_RATE_WINDOW:10}

# Blog cong khai (tat = an trang blog/post + API blog + sitemap; admin van soan bai duoc)
app.features.blog=${FEATURE_BLOG:false}

# Danh sach origin duoc goi API, cach nhau boi dau phay
app.cors.allowed-origins=${CORS_ORIGINS:*}
