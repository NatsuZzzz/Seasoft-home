<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Khong gui token trong URL sang trang khac qua Referer -->
    <meta name="referrer" content="no-referrer" />
    <title>Đặt lại mật khẩu — SeaSoft</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/auth-pages.css" />
  </head>

  <body class="min-h-screen bg-surface font-body antialiased overflow-x-hidden">
    <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
      <div class="blob-float absolute -top-32 -left-32 w-[520px] h-[520px] rounded-full bg-secondary/20 blur-3xl"></div>
      <div class="blob-float-2 absolute -bottom-40 -right-28 w-[440px] h-[440px] rounded-full bg-primary/15 blur-3xl"></div>
      <div class="absolute inset-0 dot-grid opacity-60"></div>
    </div>

    <header class="w-full px-6 pt-6 pb-4">
      <div class="max-w-screen-xl mx-auto flex items-center justify-between">
        <a href="Page.html" class="flex items-center gap-2 font-headline text-2xl font-bold tracking-tight text-dark-navy" aria-label="SeaSoft - Trang chủ">
          <span class="w-9 h-9 rounded-lg bg-surface-alt text-primary flex items-center justify-center">
            <span class="material-symbols-outlined text-xl">waves</span>
          </span>
          <span>Sea<span class="text-primary">Soft</span></span>
        </a>
      </div>
    </header>

    <main class="flex items-center justify-center px-4 py-10 min-h-[calc(100vh-88px)]">
      <div class="w-full max-w-md">
        <div class="glass-card rounded-2xl shadow-cardHover border border-border/70 p-8 sm:p-10 fade-slide-up">
          <div id="step-form">
            <div class="text-center mb-8 space-y-1.5">
              <h1 class="font-display text-2xl sm:text-3xl font-bold text-dark-navy">Đặt lại mật khẩu</h1>
              <p class="text-sm text-text-muted">Tạo mật khẩu mới cho tài khoản của bạn</p>
            </div>

            <form id="reset-form" novalidate class="space-y-5">
              <div class="space-y-1.5">
                <label for="password" class="block text-sm font-semibold text-dark-navy">Mật khẩu mới</label>
                <input id="password" type="password" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự"
                  class="form-input-sea w-full bg-white border border-border rounded-xl py-3 px-4 text-sm text-dark-navy placeholder:text-gray-400 focus:ring-0" />
              </div>
              <div class="space-y-1.5">
                <label for="confirm" class="block text-sm font-semibold text-dark-navy">Nhập lại mật khẩu</label>
                <input id="confirm" type="password" autocomplete="new-password" placeholder="••••••••"
                  class="form-input-sea w-full bg-white border border-border rounded-xl py-3 px-4 text-sm text-dark-navy placeholder:text-gray-400 focus:ring-0" />
              </div>

              <button id="submit-btn" type="submit"
                class="btn-submit w-full flex items-center justify-center gap-2 bg-primary text-white font-semibold text-sm rounded-xl py-3.5 shadow-md">
                <span id="submit-text">Đặt lại mật khẩu</span>
              </button>

              <div id="form-error" class="hidden rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-600"></div>
            </form>
          </div>

          <div id="step-done" class="hidden text-center space-y-4">
            <div class="flex justify-center">
              <span class="w-14 h-14 rounded-2xl bg-green-50 text-green-600 flex items-center justify-center">
                <span class="material-symbols-outlined text-3xl">check_circle</span>
              </span>
            </div>
            <h1 class="font-display text-2xl font-bold text-dark-navy">Xong rồi!</h1>
            <p class="text-sm text-text-muted">Mật khẩu đã được đổi. Các thiết bị khác đã được đăng xuất.</p>
            <a href="login.html" class="btn-submit inline-flex items-center gap-2 bg-primary text-white font-semibold text-sm rounded-xl px-6 py-3">
              Đăng nhập ngay
            </a>
          </div>
        </div>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
      const token = new URLSearchParams(location.search).get("token");
      const form = document.getElementById("reset-form");
      const btn = document.getElementById("submit-btn");
      const btnText = document.getElementById("submit-text");
      const formError = document.getElementById("form-error");

      function showError(msg) {
        formError.textContent = msg;
        formError.classList.remove("hidden");
      }

      if (!token) {
        showError("Link không hợp lệ. Vui lòng yêu cầu link đặt lại mật khẩu mới.");
        btn.disabled = true;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        formError.classList.add("hidden");
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        if (password.length < 6) return showError("Mật khẩu phải có ít nhất 6 ký tự");
        if (password !== confirm) return showError("Mật khẩu nhập lại không khớp");

        btn.disabled = true;
        btnText.textContent = "Đang xử lý…";
        try {
          await Auth.request("/api/auth/reset-password", {
            method: "POST",
            body: { token, newPassword: password },
          });
          Auth.clear();
          document.getElementById("step-form").classList.add("hidden");
          document.getElementById("step-done").classList.remove("hidden");
        } catch (err) {
          showError(
            err.message +
              (err.status === 400 && !err.errors?.newPassword
                ? " — Bạn có thể yêu cầu link mới ở trang Quên mật khẩu."
                : ""),
          );
        } finally {
          btn.disabled = false;
          btnText.textContent = "Đặt lại mật khẩu";
        }
      });
    </script>
  </body>
</html>
