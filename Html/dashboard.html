<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dự án của tôi — SeaSoft</title>
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/material-symbols.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/auth-pages.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <script src="js/auth.js"></script>
    <script>Auth.requireAuth();</script>
  </head>

  <body class="min-h-screen bg-surface font-body antialiased overflow-x-hidden text-dark-navy">
    <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
      <div class="blob-float absolute -top-32 -left-32 w-[520px] h-[520px] rounded-full bg-secondary/20 blur-3xl"></div>
      <div class="blob-float-2 absolute -bottom-40 -right-28 w-[440px] h-[440px] rounded-full bg-primary/15 blur-3xl"></div>
      <div class="absolute inset-0 dot-grid opacity-60"></div>
    </div>

    <div id="site-header"></div>

    <main class="px-4 py-8">
      <div class="max-w-screen-lg mx-auto space-y-8">
        <div class="flex flex-wrap items-end justify-between gap-4 fade-slide-up">
          <div>
            <p class="text-sm font-semibold text-primary uppercase tracking-wider">Cổng khách hàng</p>
            <h1 class="text-3xl sm:text-4xl font-bold mt-1">Dự án của tôi</h1>
            <p class="text-sm text-text-muted mt-2">Theo dõi tiến độ, các mốc bàn giao và trao đổi với đội ngũ SeaSoft.</p>
          </div>
          <a href="Page.html#contact" class="btn-submit inline-flex items-center gap-2 bg-primary text-dark-navy font-semibold text-sm rounded-xl px-5 py-3 shadow-md">
            <span class="material-symbols-outlined text-lg">add</span> Yêu cầu dự án mới
          </a>
        </div>

        <div id="projects" class="grid gap-6 md:grid-cols-2 stagger-in" aria-live="polite"></div>

        <div id="empty" class="hidden glass-card rounded-2xl border border-border/70 shadow-card p-10 text-center space-y-4 fade-slide-up">
          <span class="material-symbols-outlined text-5xl text-primary">rocket_launch</span>
          <h2 class="text-xl font-bold">Bạn chưa có dự án nào</h2>
          <p class="text-sm text-text-muted max-w-md mx-auto">
            Khi SeaSoft chốt phương án với bạn, dự án sẽ xuất hiện ở đây kèm tiến độ từng giai đoạn.
          </p>
          <a href="Page.html#contact" class="inline-flex text-sm font-semibold text-primary hover:text-dark-navy">Gửi yêu cầu tư vấn →</a>
        </div>
        <p id="error" class="hidden text-sm text-red-600 bg-red-50 rounded-xl p-4"></p>
      </div>
    </main>

    <script src="js/labels.js"></script>
    <script src="js/portal.js"></script>
    <script>
      document.getElementById("site-header").innerHTML = Portal.header();
      const L = Labels;

      Auth.api("/api/projects")
        .then((items) => {
          document.getElementById("empty").classList.toggle("hidden", items.length > 0);
          const box = document.getElementById("projects");
          box.innerHTML = items
            .map(
              (p) => `<a href="project.html?id=${p.id}" class="group glass-card rounded-2xl border border-border/70 shadow-card hover:shadow-cardHover p-6 flex flex-col gap-4 transition-shadow">
                <div class="flex items-start justify-between gap-3">
                  <div>
                    <p class="text-xs font-semibold text-text-muted">${L.esc(p.code)} · ${L.esc(L.service[p.serviceType])}</p>
                    <h2 class="text-lg font-bold mt-1 group-hover:text-primary transition-colors">${L.esc(p.name)}</h2>
                  </div>
                  ${L.statusBadge(p.status, L.projectStatus)}
                </div>
                <div class="space-y-2">
                  <div class="flex justify-between text-sm"><span class="text-text-muted">Tiến độ</span><b>${p.progress}%</b></div>
                  ${Portal.progressBar(p.progress)}
                </div>
                <div class="flex flex-wrap justify-between gap-2 text-xs text-text-muted">
                  <span>Phụ trách: <b class="text-dark-navy">${L.esc(p.managerName || "—")}</b></span>
                  <span>Hạn: <b class="text-dark-navy">${p.dueDate ? L.date(p.dueDate, false) : "—"}</b></span>
                </div>
                <span class="text-sm font-semibold text-primary mt-auto">Xem chi tiết →</span>
              </a>`,
            )
            .join("");
          Portal.animateProgress(box);
        })
        .catch((err) => {
          const e = document.getElementById("error");
          e.textContent = err.message;
          e.classList.remove("hidden");
        });
    </script>
  </body>
</html>
