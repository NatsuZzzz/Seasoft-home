<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Quản trị — SeaSoft</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/auth-pages.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <script src="js/auth.js"></script>
    <script>Auth.requireAuth();</script>
  </head>

  <body class="min-h-screen bg-surface font-body antialiased text-dark-navy">
    <!-- Khong phai nhan vien -->
    <div id="forbidden" class="hidden min-h-screen flex items-center justify-center p-6">
      <div class="glass-card rounded-2xl shadow-cardHover border border-border/70 p-10 text-center max-w-md space-y-4">
        <span class="material-symbols-outlined text-5xl text-primary">lock</span>
        <h1 class="text-2xl font-bold">Khu vực dành cho nhân viên</h1>
        <p class="text-sm text-text-muted">Tài khoản của bạn không có quyền truy cập trang quản trị.</p>
        <a href="Page.html" class="inline-flex bg-primary text-white font-semibold rounded-xl px-6 py-3">Về trang chủ</a>
      </div>
    </div>

    <div id="console" class="hidden lg:flex min-h-screen">
      <!-- Sidebar (desktop) / thanh tab (mobile) -->
      <aside class="lg:w-64 lg:flex-shrink-0 bg-dark-navy text-white lg:min-h-screen lg:sticky lg:top-0 lg:h-screen flex flex-col">
        <div class="flex items-center justify-between px-5 h-16 lg:h-20">
          <a href="Page.html" class="flex items-center gap-2 text-xl font-bold">
            <span class="material-symbols-outlined text-primary">waves</span>
            Sea<span class="text-primary -ml-2">Soft</span>
          </a>
          <span class="lg:hidden text-xs text-secondary" data-auth-name></span>
        </div>
        <nav id="tab-nav" class="flex lg:flex-col gap-1 px-3 pb-3 lg:pb-0 overflow-x-auto lg:overflow-visible" aria-label="Chức năng quản trị"></nav>
        <div class="hidden lg:block mt-auto p-5 border-t border-white/10 space-y-3">
          <div>
            <p class="text-sm font-semibold truncate" data-auth-name></p>
            <p id="my-role" class="text-xs text-secondary"></p>
          </div>
          <div class="flex gap-2">
            <a href="profile.html" class="flex-1 text-center text-xs font-semibold border border-white/20 rounded-lg py-2 hover:bg-white/10">Hồ sơ</a>
            <button data-auth-logout class="flex-1 text-xs font-semibold border border-white/20 rounded-lg py-2 hover:bg-white/10">Đăng xuất</button>
          </div>
        </div>
      </aside>

      <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-10">
        <!-- ================= TAB: LEADS ================= -->
        <section data-tab="leads" class="hidden space-y-6">
          <header class="flex flex-wrap items-end justify-between gap-4">
            <div>
              <h1 class="text-2xl sm:text-3xl font-bold">Yêu cầu tư vấn</h1>
              <p class="text-sm text-text-muted mt-1"><span id="lead-total">0</span> lead phù hợp bộ lọc</p>
            </div>
            <button id="lead-refresh" class="inline-flex items-center gap-1.5 text-sm font-semibold border border-border bg-white rounded-lg px-3 py-2 hover:border-primary hover:text-primary">
              <span class="material-symbols-outlined text-lg">refresh</span> Tải lại
            </button>
          </header>

          <!-- Bo loc -->
          <div class="bg-white rounded-2xl border border-border shadow-card p-4 flex flex-wrap gap-3 items-center">
            <div class="relative flex-1 min-w-[200px]">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-lg">search</span>
              <input id="lead-q" type="search" placeholder="Tìm tên, email, SĐT, công ty…"
                class="w-full border border-border rounded-xl py-2.5 pl-10 pr-3 text-sm focus:border-primary focus:ring-primary/20 focus:ring-4" />
            </div>
            <select id="lead-status" class="border border-border rounded-xl py-2.5 px-3 text-sm focus:border-primary focus:ring-primary/20 focus:ring-4">
              <option value="">Mọi trạng thái</option>
            </select>
            <select id="lead-scope" class="border border-border rounded-xl py-2.5 px-3 text-sm focus:border-primary focus:ring-primary/20 focus:ring-4">
              <option value="all">Tất cả</option>
              <option value="mine">Của tôi</option>
              <option value="unassigned">Chưa phân công</option>
            </select>
          </div>

          <!-- Bang -->
          <div class="bg-white rounded-2xl border border-border shadow-card overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-surface-alt/60 text-left text-xs uppercase tracking-wide text-text-muted">
                  <tr>
                    <th class="px-4 py-3 font-semibold">Khách hàng</th>
                    <th class="px-4 py-3 font-semibold hidden md:table-cell">Liên hệ</th>
                    <th class="px-4 py-3 font-semibold hidden sm:table-cell">Dịch vụ</th>
                    <th class="px-4 py-3 font-semibold">Trạng thái</th>
                    <th class="px-4 py-3 font-semibold hidden md:table-cell">Phụ trách</th>
                    <th class="px-4 py-3 font-semibold hidden lg:table-cell">Ngày gửi</th>
                  </tr>
                </thead>
                <tbody id="lead-rows" class="divide-y divide-border"></tbody>
              </table>
            </div>
            <div id="lead-empty" class="hidden p-10 text-center text-text-muted text-sm">Không có lead nào.</div>
            <div class="flex items-center justify-between px-4 py-3 border-t border-border text-sm">
              <button id="lead-prev" class="px-3 py-1.5 rounded-lg border border-border disabled:opacity-40 hover:border-primary">← Trước</button>
              <span id="lead-page" class="text-text-muted"></span>
              <button id="lead-next" class="px-3 py-1.5 rounded-lg border border-border disabled:opacity-40 hover:border-primary">Sau →</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Drawer chi tiet (dung chung cho cac tab) -->
    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="flex items-center justify-between px-6 h-16 border-b border-border">
        <h2 id="drawer-title" class="font-bold text-lg truncate"></h2>
        <button id="drawer-close" class="p-2 rounded-lg hover:bg-surface-alt" aria-label="Đóng">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="drawer-body" class="p-6 overflow-y-auto flex-1"></div>
    </aside>

    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/labels.js"></script>
    <script src="js/admin/core.js"></script>
    <script src="js/admin/leads.js"></script>
    <script>AdminApp.start();</script>
  </body>
</html>
